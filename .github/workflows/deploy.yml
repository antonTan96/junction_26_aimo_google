name: Continuous Deployment (Cloud Run & Firebase)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit & RAG regression tests
        run: |
          DISABLE_REMOTE_LLM=true npx tsx src/lib/aimogate.test.ts
          DISABLE_REMOTE_LLM=true npx tsx src/lib/rag.test.ts

      - name: Type check
        run: npm run lint

      - name: Build frontend SPA
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  deploy-cloud-run:
    name: Deploy Backend to Google Cloud Run
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          gcloud run deploy aimogate-api \
            --project=junction26hel-7631 \
            --source=. \
            --region=europe-north1 \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GEMINI_MODEL=gemini-flash-latest,VALIO_API_BASE_URL=https://junction26.valioaimo.fi,VALIO_API_KEY=${{ secrets.VALIO_API_KEY || 'junct_tDnQn4VI_nfhELGCOEkY4vbuxm324MmYmILuokYG03Y' }}"

  deploy-firebase-hosting:
    name: Deploy Frontend to Firebase Hosting
    needs: [test-and-build, deploy-cloud-run]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_TOKEN != '' || env.GCP_SA_KEY != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_KEY }}'
          channelId: live
          projectId: junction26hel-7631
