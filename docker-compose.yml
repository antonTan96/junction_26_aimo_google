services:
  mariadb:
    image: mariadb:11.4
    container_name: aimogate-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_junction26
      MARIADB_DATABASE: aimogate
      MARIADB_USER: aimo_user
      MARIADB_PASSWORD: aimo_secure_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  aimogate-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aimogate-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: aimogate
      MARIADB_USER: aimo_user
      MARIADB_PASSWORD: aimo_secure_password_2026
      VALIO_API_BASE_URL: https://junction26.valioaimo.fi
      VALIO_API_KEY: junct_tDnQn4VI_nfhELGCOEkY4vbuxm324MmYmILuokYG03Y
      VALIO_CATALOG_PATH: /app/data/valio_aimo_junction26_product_data.json
      DATACRUNCH_ENDPOINT: https://containers.datacrunch.io/nemotron-3-5-super-vl-b300/v1
      DATACRUNCH_MODEL: nemotron-3.5-super-vl
      DATACRUNCH_API_KEY: dc_176bde1bc2f74ecb83a0640d93d6bb20589aa5d227eaf9fd7208fe2985f7ded208b41c8f4049cf95c838f57290f0c94dfb8d0f4e93de8327352454c4ca19f230429045b393256b150e50a5738583b6b6e58e129bf00a0757a7b1b88c75c44118d1553782e5d0988f7698d3558c4b2ea2f8f974baee5038ebf153ac3bf671201a
    volumes:
      - ../junction26_aimo/valio_aimo_junction26_product_data.json:/app/data/valio_aimo_junction26_product_data.json:ro
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
    driver: local
